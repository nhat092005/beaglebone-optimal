require conf/distro/poky-tiny.conf
DISTRO = "optimal-tiny"
DISTRO_NAME = "Optimal Tiny"
DISTROOVERRIDES = "poky:poky-tiny:optimal-tiny"
INIT_MANAGER = "none"

# Phase 1 tiny path strips all optional distro features and adds back only what
# is boot-essential through machine/kernel metadata.
DISTRO_FEATURES_TINY = ""
DISTRO_FEATURES_NET = ""
DISTRO_FEATURES_USB = ""
DISTRO_FEATURES_USBGADGET = ""
DISTRO_FEATURES_WIFI = ""
DISTRO_FEATURES = ""

USE_NLS = "no"
IMAGE_LINGUAS = ""
POKY_DEFAULT_EXTRA_RRECOMMENDS = ""
BAD_RECOMMENDATIONS += "busybox-udhcpc"

EXTRA_IMAGE_FEATURES = ""

VIRTUAL-RUNTIME_base-utils = "busybox"
VIRTUAL-RUNTIME_base-utils-syslog = ""
VIRTUAL-RUNTIME_update-alternatives = ""
VIRTUAL-RUNTIME_dev_manager = ""
