#@TYPE: Machine
#@NAME: beaglebone-black-optimal-qt-dashboard-noab
#@DESCRIPTION: Product-side Qt dashboard machine without A/B/OTA - single rootfs.

require conf/machine/beaglebone-black-optimal-tiny.conf

MACHINEOVERRIDES =. "beaglebone-black-optimal-qt-dashboard:"
MACHINEOVERRIDES =. "beaglebone-black-optimal-tiny:"

INITRAMFS_IMAGE = ""
INITRAMFS_IMAGE_BUNDLE = "0"

DTB_FILES = "am335x-boneblack-optimal-qt-dashboard.dtb"
KERNEL_DEVICETREE = "ti/omap/am335x-boneblack-optimal-qt-dashboard.dtb"

UBOOT_EXTLINUX_INSTALL = "1"
IMAGE_BOOT_FILES = "u-boot.${UBOOT_SUFFIX} ${SPL_BINARY} ${KERNEL_IMAGETYPE} ${DTB_FILES}"

WKS_FILE = "beaglebone-qt-dashboard-noab.wks"

DISTRO_FEATURES:append = " optimal-gpio-leds optimal-i2c2-bus optimal-rtc-ds3231 optimal-sht3x optimal-bh1750"
OPTIMAL_REQUIRED_FEATURES = "optimal-gpio-leds optimal-i2c2-bus optimal-rtc-ds3231 optimal-sht3x optimal-bh1750"
