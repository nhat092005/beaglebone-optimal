# Root filesystem
CONFIG_EXT4_FS=y

# HDMI display pipeline (DRM/TILCDC + IT66121/2 bridge) and fbdev for Qt
CONFIG_DRM=y
CONFIG_DRM_TILCDC=y
CONFIG_DRM_ITE_IT66121=y
CONFIG_DRM_DISPLAY_CONNECTOR=y
CONFIG_FB=y
CONFIG_FB_DEVICE=y
CONFIG_DRM_FBDEV_EMULATION=y

# Networking
CONFIG_NET=y
CONFIG_UNIX=y

# Unused peripherals
# CONFIG_BACKLIGHT_TPS65217 is not set

# Kernel module support
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

# Compat
CONFIG_COMPAT_32BIT_TIME=y
