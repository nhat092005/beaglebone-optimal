# DEV-ONLY: NFS-root with static ip= from U-Boot.
CONFIG_INET=y
CONFIG_NETWORK_FILESYSTEMS=y
CONFIG_NFS_FS=y
CONFIG_ROOT_NFS=y
CONFIG_IP_PNP=y

# Kernel gadget Ethernet, separate from U-Boot usb_ether.
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_GADGET=y
CONFIG_USB_MUSB_DSPS=y
CONFIG_USB_ETH=y

# MUSB needs the DT-bound usb0 PHY.
CONFIG_NOP_USB_XCEIV=y
CONFIG_AM335X_PHY_USB=y

# MUSB also needs AM335x CPPI 4.1 DMA.
CONFIG_USB_TI_CPPI41_DMA=y
