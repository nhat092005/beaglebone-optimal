# DEV-ONLY: NFS-root support. No IP_PNP_DHCP - U-Boot passes a static ip=.
CONFIG_INET=y
CONFIG_NETWORK_FILESYSTEMS=y
CONFIG_NFS_FS=y
CONFIG_ROOT_NFS=y
CONFIG_IP_PNP=y

# USB gadget Ethernet: kernel's own driver, separate from U-Boot's usb_ether.
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_GADGET=y
CONFIG_USB_MUSB_DSPS=y
CONFIG_USB_ETH=y

# musb needs its PHY bound (phys=<&usb0_phy> in DT) or musb_init_controller fails -ENXIO.
CONFIG_NOP_USB_XCEIV=y
CONFIG_AM335X_PHY_USB=y

# musb also needs a DMA controller or musb_init_controller fails -ENODEV
# ("DMA controller not set", musb_core.c). CPPI 4.1 is AM335x's native musb DMA engine.
CONFIG_USB_TI_CPPI41_DMA=y
