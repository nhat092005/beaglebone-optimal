# Loadable module support (not needed, kernel is built monolithic)
CONFIG_MODULES=n

# Networking stack (unused on tiny image)
CONFIG_NET=n
CONFIG_NETWORK_FILESYSTEMS=n
CONFIG_INET=n
CONFIG_UNIX=n

# USB host/device support (unused)
CONFIG_USB_SUPPORT=n
CONFIG_USB=n

# Audio (unused)
CONFIG_SOUND=n
CONFIG_SND=n

# Framebuffer / DRM display (unused on tiny image)
CONFIG_FB=n
CONFIG_FRAMEBUFFER_CONSOLE=n
CONFIG_DRM=n

# SPI bus (unused)
CONFIG_SPI=n

# Filesystems not needed for the tiny rootfs
CONFIG_FAT_FS=n
CONFIG_MSDOS_FS=n
CONFIG_VFAT_FS=n
CONFIG_EXT4_FS=n

# Hardware watchdog (unused)
CONFIG_WATCHDOG=n
