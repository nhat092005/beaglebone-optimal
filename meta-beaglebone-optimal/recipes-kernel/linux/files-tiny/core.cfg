# ARM base arch
CONFIG_ARM=y
CONFIG_MMU=y
CONFIG_ARCH_MULTI_V7=y
CONFIG_ARM_PATCH_PHYS_VIRT=y
CONFIG_AUTO_ZRELADDR=y

# Initramfs boot support
CONFIG_BLK_DEV_INITRD=y

# Core virtual filesystems (/dev, /proc, /sys, tmpfs)
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_TMPFS=y

# Userspace essentials (init script exec, PTYs)
CONFIG_BINFMT_SCRIPT=y
CONFIG_UNIX98_PTYS=y

# Kernel log
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y

# Kernel image compression
CONFIG_KERNEL_LZ4=y
