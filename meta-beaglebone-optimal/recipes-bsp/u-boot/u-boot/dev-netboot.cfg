# DEV-ONLY: TFTP+NFS over USB gadget (RJ45 CPSW dead on this board, see usb-gadget.cfg).

# needs hush: bootcmd below chains commands with ';'.
CONFIG_HUSH_PARSER=y

# netboot flow proven working end-to-end; no need for an interrupt window.
CONFIG_BOOTDELAY=0

# NETDEVICES selects DM_ETH (DM_ETH has no prompt, can't set directly).
CONFIG_NET=y
CONFIG_NETDEVICES=y
CONFIG_CMD_NET=y
CONFIG_CMD_DHCP=y
CONFIG_CMD_PING=y
CONFIG_CMD_TFTPBOOT=y

# baked in (no persistent env); ip= uses usb0 (Linux's name, not u-boot's usb_ether).
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="setenv ethact usb_ether; setenv ethrotate no; setenv ipaddr 192.168.7.2; setenv serverip 192.168.7.1; setenv loadaddr 0x82000000; setenv fdtaddr 0x88000000; tftpboot ${loadaddr} zImage; tftpboot ${fdtaddr} am335x-boneblack-optimal-qt-dashboard.dtb; setenv bootargs console=ttyS0,115200n8 root=/dev/nfs rw nfsroot=192.168.7.1:/srv/nfs/bbb-dev/rootfs,vers=3,tcp ip=192.168.7.2:192.168.7.1:192.168.7.1:255.255.255.0::usb0:off; bootz ${loadaddr} - ${fdtaddr}"
