# DEV-ONLY: USB gadget hardware (RJ45 CPSW dead on this board).
CONFIG_AM335X_USB0=y
CONFIG_AM335X_USB0_PERIPHERAL=y
CONFIG_USB=y
CONFIG_DM_USB_GADGET=y

# ti-musb.c is dual-role: needs both to link (runtime is peripheral-only via DTS).
CONFIG_USB_MUSB_HOST=y
CONFIG_USB_MUSB_GADGET=y
CONFIG_USB_MUSB_TI=y
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_VENDOR_NUM=0x0451
CONFIG_USB_GADGET_PRODUCT_NUM=0xd022
CONFIG_USB_ETHER=y

# calls usb_ether_init() from arch_misc_init(); without it usb_ether never binds.
CONFIG_ARCH_MISC_INIT=y
