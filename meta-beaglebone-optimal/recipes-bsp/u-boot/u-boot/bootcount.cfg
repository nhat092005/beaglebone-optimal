# A/B bootcount config.
# Keep offsets in sync with libubootenv/fw_env.config.
CONFIG_HUSH_PARSER=y
CONFIG_ZERO_BOOTDELAY_CHECK=y

# bootcount.env provides bootcmd/altbootcmd.
# CONFIG_USE_BOOTCOMMAND is not set

# Persistent env in eMMC boot partition 2 on mmc0.
CONFIG_ENV_IS_IN_MMC=y
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_SYS_MMC_ENV_PART=2
CONFIG_ENV_OFFSET=0x0
CONFIG_ENV_SIZE=0x20000
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_OFFSET_REDUND=0x20000

# Defaults come from board/ti/am335x/bootcount.env.
CONFIG_ENV_SOURCE_FILE="bootcount"
