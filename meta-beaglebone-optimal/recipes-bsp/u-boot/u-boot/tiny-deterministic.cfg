CONFIG_BOOTCOMMAND="run findfdt; run init_console; sysboot mmc 0:1 any ${scriptaddr} /extlinux/extlinux.conf"
# CONFIG_BOOTSTD is not set
# CONFIG_BOOTMETH_VBE is not set
# CONFIG_BOOTMETH_VBE_REQUEST is not set
# CONFIG_BOOTMETH_VBE_SIMPLE is not set
# CONFIG_BOOTMETH_VBE_SIMPLE_OS is not set
# CONFIG_DISTRO_DEFAULTS is not set
CONFIG_USE_BOOTCOMMAND=y
CONFIG_HUSH_PARSER=y
CONFIG_CMD_SYSBOOT=y
CONFIG_FS_FAT=y
# CONFIG_OF_BOARD_SETUP is not set
# CONFIG_ENV_IS_IN_FAT is not set
CONFIG_ENV_IS_NOWHERE=y
