require conf/distro/optimal-tiny.conf

DISTRO      = "optimal-qt-dashboard"
DISTRO_NAME = "Optimal Qt Dashboard"
DISTROOVERRIDES = "poky:poky-tiny:optimal-tiny:optimal-qt-dashboard"

# init-manager-none.inc does not set DISTRO_FEATURES_BACKFILL_CONSIDERED for
# sysvinit, so bitbake backfills sysvinit into DISTRO_FEATURES and
# sysvinit-inittab gets installed alongside busybox-inittab.
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
BAD_RECOMMENDATIONS += "sysvinit sysvinit-inittab"

# Product policy: local-only single-app HDMI appliance.
# Strip desktop/audio/network-discovery surfaces not needed for the dashboard.
DISTRO_FEATURES:remove = " \
    alsa \
    x11 \
    wayland \
    opengl \
    vulkan \
    ptest \
    pulseaudio \
    bluetooth \
    3g \
    nfc \
    wifi \
    zeroconf \
    ipv6 \
    nfs \
    gobject-introspection-data \
"
MACHINE_FEATURES:remove = "alsa"
PACKAGECONFIG:remove:pn-qemu-system-native = "sdl"
