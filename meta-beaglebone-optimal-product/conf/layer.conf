BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "beaglebone_optimal_product"
BBFILE_PATTERN_beaglebone_optimal_product = "^${LAYERDIR}/"
BBFILE_PRIORITY_beaglebone_optimal_product = "9"

LAYERVERSION_beaglebone_optimal_product = "1"
LAYERSERIES_COMPAT_beaglebone_optimal_product = "scarthgap"

LAYERDEPENDS_beaglebone_optimal_product = "core yocto-bsp beaglebone_optimal qt6-layer"

# Capture layer dir at parse time so recipes can reference it without relying
# on LAYERDIR (which is not stable in recipe context).
BEAGLEBONE_OPTIMAL_PRODUCT_LAYERDIR := "${LAYERDIR}"

# Weak default: auto-compute BSPDIR as the parent of this layer dir.
# Override in local.conf with BSPDIR = "/your/path" if building outside Docker.
BSPDIR ??= "${@os.path.abspath(os.path.join(d.getVar('LAYERDIR'), '..'))}"
