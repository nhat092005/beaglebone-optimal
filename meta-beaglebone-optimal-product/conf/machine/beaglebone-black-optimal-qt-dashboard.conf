#@TYPE: Machine
#@NAME: beaglebone-black-optimal-qt-dashboard
#@DESCRIPTION: Product-side BeagleBone Black machine for the Qt dashboard path

require conf/machine/beaglebone-yocto.conf

# The product path targets BBB Black only. Keep the deployed DTB surface
# deterministic so U-Boot and the .wic boot partition do not expose multiple
# board DTBs that this product path does not own.
DTB_FILES = "am335x-boneblack-optimal-qt-dashboard.dtb"
KERNEL_DEVICETREE = "ti/omap/am335x-boneblack-optimal-qt-dashboard.dtb"

# Keep U-Boot auto extlinux generation disabled. The product WKS file owns the
# final extlinux.conf content written into the boot partition.
UBOOT_EXTLINUX_INSTALL = "0"
IMAGE_BOOT_FILES = "u-boot.${UBOOT_SUFFIX} ${SPL_BINARY} ${KERNEL_IMAGETYPE} ${DTB_FILES}"

# Use product-side WKS file
WKS_FILE = "beaglebone-qt-dashboard.wks"
