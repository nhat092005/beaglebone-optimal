default slot_a
label slot_a
    kernel /zImage
    fdt /am335x-boneblack-optimal-qt-dashboard.dtb
append root=/dev/mmcblk0p2 rootwait console=ttyS0,115200 quiet video=HDMI-A-1:1280x720@60D
label slot_b
    kernel /zImage
    fdt /am335x-boneblack-optimal-qt-dashboard.dtb
append root=/dev/mmcblk0p3 rootwait console=ttyS0,115200 quiet video=HDMI-A-1:1280x720@60D
