name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HADOLINT_VERSION: v2.14.0
      YAMLLINT_VERSION: 1.33.0
      CLANG_FORMAT_VERSION: 1:18.1.3-1ubuntu1
      SHFMT_VERSION: 3.8.0-1
      SHELLCHECK_VERSION: 0.9.0-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.0

      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            "clang-format-18=${CLANG_FORMAT_VERSION}" \
            "shfmt=${SHFMT_VERSION}" \
            "shellcheck=${SHELLCHECK_VERSION}" \
            python3-pip
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - name: Show tool versions
        run: |
          clang-format --version
          shfmt --version
          shellcheck --version
          yamllint --version
          hadolint --version

      - name: Check formatting
        run: make format-check

      - name: Run linters
        run: make lint
